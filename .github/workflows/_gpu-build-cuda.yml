name: _gpu-build-cuda

# Reusable workflow: builds CUDA 12.4 wheels for Linux x86_64.
# Called by build-gpu-wheels.yml (stable) and build-gpu-wheels-abi3.yml (abi3).
# Do not invoke directly — `workflow_call` only.

on:
  workflow_call:
    inputs:
      wheel_kind:
        description: '"stable" | "abi3" — controls artifact + cache key prefix'
        type: string
        required: true
      cibw_version:
        description: 'cibuildwheel pin (e.g. 3.4.0 or 3.4.1)'
        type: string
        required: true
      cibw_build:
        description: 'CIBW_BUILD selector (e.g. "cp310-* ... cp314-*" or "cp312-*")'
        type: string
        required: true
      link_mode:
        description: '"dynamic" | "static"'
        type: string
        required: true
      enabled:
        description: 'Whether this backend should run'
        type: boolean
        required: true
      extra_cibw_env:
        description: 'Extra newline-separated KEY=VALUE pairs appended to CIBW_ENVIRONMENT_LINUX (use "" for none)'
        type: string
        default: ""

jobs:
  build:
    if: inputs.enabled
    name: ${{ inputs.wheel_kind == 'abi3' && 'CUDA 12.4 abi3' || 'CUDA 12.4' }} - Linux x86_64 (${{ inputs.link_mode }})
    runs-on: ubuntu-22.04
    env:
      CIBW_BUILD: ${{ inputs.cibw_build }}

    steps:
      # Fail fast on bad input values. workflow_call doesn't support
      # `choice` inputs, so we validate at run time. A typo in a caller
      # would otherwise silently fall through the
      # `${{ x == 'stable' && ... || ... }}` ternaries below.
      - name: Validate inputs
        shell: bash
        run: |
          case "${{ inputs.wheel_kind }}" in
            stable|abi3) ;;
            *) echo "::error::wheel_kind must be 'stable' or 'abi3', got '${{ inputs.wheel_kind }}'"; exit 1 ;;
          esac
          case "${{ inputs.link_mode }}" in
            dynamic|static) ;;
            *) echo "::error::link_mode must be 'dynamic' or 'static', got '${{ inputs.link_mode }}'"; exit 1 ;;
          esac
          if [[ ! "${{ inputs.cibw_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cibw_version must be X.Y.Z, got '${{ inputs.cibw_version }}'"; exit 1
          fi
          if [[ -z "${{ inputs.cibw_build }}" ]]; then
            echo "::error::cibw_build must not be empty"; exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Cache thirdparty deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: thirdparty/
          key: deps-${{ inputs.wheel_kind == 'abi3' && 'abi3-' || '' }}cuda-${{ inputs.link_mode }}-${{ hashFiles('scripts/manage.py', 'pyproject.toml', '.github/workflows/_gpu-build-cuda.yml') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: pip install "cibuildwheel==${{ inputs.cibw_version }}"

      - name: Set CCACHE_DIR to workspace
        run: echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ inputs.wheel_kind == 'abi3' && 'abi3-' || '' }}cuda-${{ inputs.link_mode }}
          evict-old-files: 1d

      - name: Build CUDA wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: >
            CI_PYTHON=$(ls -d /opt/python/cp3*/bin | head -1) &&
            $CI_PYTHON/python {project}/scripts/manage.py ci_before_all --backend cuda
            ${{ inputs.link_mode == 'dynamic' && '--dynamic' || '' }}
          CIBW_BEFORE_BUILD_LINUX: >
            cd {project} && python scripts/manage.py cibw_before_build --rename inferna-cuda12
          CIBW_ENVIRONMENT_LINUX: >
            GGML_CUDA=1
            GGML_METAL=0
            CUDA_PATH=/usr/local/cuda
            CMAKE_CUDA_ARCHITECTURES="75"
            GGML_NATIVE=OFF
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            CFLAGS=-s
            CXXFLAGS=-s
            CCACHE_DIR=/project/.ccache
            CCACHE_DEPEND=1
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            CMAKE_CUDA_COMPILER_LAUNCHER=ccache
            WITH_DYLIB=${{ inputs.link_mode == 'dynamic' && '1' || '0' }}
            SD_USE_VENDORED_GGML=${{ inputs.link_mode == 'dynamic' && '0' || '1' }}
            ${{ inputs.extra_cibw_env }}
          CIBW_TEST_COMMAND: ""
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            python {project}/scripts/manage.py wheel_repair --backend cuda --dest-dir {dest_dir} {wheel}

      - name: List built wheels
        run: ls -lah wheelhouse/

      # Catches drift between the wheel's actual DT_NEEDED entries and the
      # backend's exclude list in scripts/manage.py
      # (WHEEL_REPAIR_EXCLUDES_LINUX). A vendor SDK soname bump (e.g.
      # libcudart.so.12 -> 13) that we forget to add to the exclude list
      # would otherwise be silently bundled or break the build.
      - name: Audit built wheels
        run: |
          for w in wheelhouse/*.whl; do
            python3 scripts/audit_wheel.py "$w"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ inputs.wheel_kind == 'abi3' && 'abi3-' || '' }}cuda-linux-x86_64
          path: ./wheelhouse/*.whl
