name: _gpu-smoke

# Reusable smoke-test job for GPU wheels. Called by build-gpu-wheels.yml
# (stable) and build-gpu-wheels-abi3.yml (abi3) after the per-backend
# build jobs complete. Each entry of the matrix is gated on whether the
# corresponding backend was actually requested by the caller.

on:
  workflow_call:
    inputs:
      wheel_kind:
        description: '"stable" | "abi3" — controls which artifact name to download'
        type: string
        required: true
      cuda_linux:
        type: boolean
        required: true
      rocm_linux:
        type: boolean
        required: true
      sycl_linux:
        type: boolean
        required: true
      vulkan_linux:
        type: boolean
        required: true
      cuda_windows:
        type: boolean
        required: true
      vulkan_windows:
        type: boolean
        required: true
      vulkan_macos_intel:
        type: boolean
        required: true

jobs:
  smoke:
    name: Smoke test - ${{ matrix.backend }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            runs-on: ubuntu-latest
            slug: cuda-linux-x86_64
            condition: cuda_linux
          - backend: rocm
            runs-on: ubuntu-latest
            slug: rocm-linux-x86_64
            condition: rocm_linux
          - backend: sycl
            runs-on: ubuntu-latest
            slug: sycl-linux-x86_64
            condition: sycl_linux
          - backend: vulkan
            runs-on: ubuntu-latest
            slug: vulkan-linux-x86_64
            condition: vulkan_linux
          - backend: cuda-windows
            runs-on: windows-latest
            slug: cuda-windows-x86_64
            condition: cuda_windows
          - backend: vulkan-windows
            runs-on: windows-latest
            slug: vulkan-windows-x86_64
            condition: vulkan_windows
          - backend: vulkan-macos-intel
            runs-on: macos-15-intel
            slug: vulkan-macos-intel-x86_64
            condition: vulkan_macos_intel

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          case "${{ inputs.wheel_kind }}" in
            stable|abi3) ;;
            *) echo "::error::wheel_kind must be 'stable' or 'abi3', got '${{ inputs.wheel_kind }}'"; exit 1 ;;
          esac

      - name: Check if backend was built
        id: check
        shell: bash
        env:
          # Indirect through env so we can index by matrix.condition string.
          CUDA_LINUX: ${{ inputs.cuda_linux }}
          ROCM_LINUX: ${{ inputs.rocm_linux }}
          SYCL_LINUX: ${{ inputs.sycl_linux }}
          VULKAN_LINUX: ${{ inputs.vulkan_linux }}
          CUDA_WINDOWS: ${{ inputs.cuda_windows }}
          VULKAN_WINDOWS: ${{ inputs.vulkan_windows }}
          VULKAN_MACOS_INTEL: ${{ inputs.vulkan_macos_intel }}
        run: |
          # Map matrix.condition (e.g. cuda_linux) to the corresponding env var.
          case "${{ matrix.condition }}" in
            cuda_linux)         val="$CUDA_LINUX" ;;
            rocm_linux)         val="$ROCM_LINUX" ;;
            sycl_linux)         val="$SYCL_LINUX" ;;
            vulkan_linux)       val="$VULKAN_LINUX" ;;
            cuda_windows)       val="$CUDA_WINDOWS" ;;
            vulkan_windows)     val="$VULKAN_WINDOWS" ;;
            vulkan_macos_intel) val="$VULKAN_MACOS_INTEL" ;;
            *)                  val="false" ;;
          esac
          if [ "$val" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Compute artifact name
        if: steps.check.outputs.skip != 'true'
        id: artifact
        shell: bash
        run: |
          PREFIX=""
          if [ "${{ inputs.wheel_kind }}" = "abi3" ]; then PREFIX="abi3-"; fi
          echo "name=wheels-${PREFIX}${{ matrix.slug }}" >> "$GITHUB_OUTPUT"

      - name: Download wheel artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: wheels

      - name: Find matching wheel
        if: steps.check.outputs.skip != 'true'
        id: find-wheel
        shell: bash
        run: |
          WHEEL=$(find wheels -name "*cp312*" | head -1)
          if [ -z "$WHEEL" ]; then
            WHEEL=$(find wheels -name "*.whl" | head -1)
          fi
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "Found wheel: $WHEEL"

      - name: Install wheel in clean venv
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          python -m venv smoke-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          pip install "${{ steps.find-wheel.outputs.wheel }}"

      # ----- GPU runtime install (per-backend) -----
      # Dynamic-link wheels exclude the GPU runtime libs (libcudart, libhipblas,
      # libsycl, ...) via auditwheel/delvewheel `--exclude` / `--no-dll`.
      # Stock GitHub runners have no GPU toolkit installed, so `import inferna`
      # would otherwise fail with `ImportError: libX.so.N`. We install the
      # minimum runtime DSOs/DLLs here, before the import smoke step.

      # CUDA Linux: cudart + cublas come from PyPI nvidia-* wheels. ggml-cuda.so
      # also has a NEEDED on libcuda.so.1 (the userspace driver lib). Stock
      # ubuntu-latest has no NVIDIA driver, so we grab the stub from the CUDA
      # toolkit (Jimver) and symlink it as libcuda.so.1. Stub is enough for
      # dlopen/import; the CPU-fallback test passes n_gpu_layers=0.
      - name: Install CUDA Toolkit stubs (CUDA Linux)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.0'
          method: network
          sub-packages: '["cudart"]'

      - name: Install CUDA runtime libs (CUDA Linux)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'cuda'
        shell: bash
        run: |
          source smoke-venv/bin/activate
          pip install nvidia-cuda-runtime-cu12 nvidia-cublas-cu12
          PURELIB=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          CUDART_DIR="$PURELIB/nvidia/cuda_runtime/lib"
          CUBLAS_DIR="$PURELIB/nvidia/cublas/lib"
          ls "$CUDART_DIR" "$CUBLAS_DIR"
          # Locate the libcuda.so stub from the CUDA toolkit and expose it as
          # libcuda.so.1 in a dedicated directory we add to LD_LIBRARY_PATH.
          STUB_SRC=$(find "$CUDA_PATH" -name 'libcuda.so' -path '*/stubs/*' | head -1)
          if [ -z "$STUB_SRC" ]; then
            echo "::error::libcuda.so stub not found under $CUDA_PATH"; exit 1
          fi
          STUB_DIR="$HOME/cuda-stubs"
          mkdir -p "$STUB_DIR"
          ln -sf "$STUB_SRC" "$STUB_DIR/libcuda.so.1"
          echo "Stub: $STUB_SRC -> $STUB_DIR/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$CUDART_DIR:$CUBLAS_DIR:$STUB_DIR:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # CUDA Windows: install cudart + cublas redist DLLs via Jimver. The
      # action sets CUDA_PATH but its PATH export is sometimes flaky, so we
      # also append `%CUDA_PATH%\bin` to $GITHUB_PATH explicitly and dump the
      # bin contents for diagnostics — we need cudart64_12.dll, cublas64_12.dll
      # and cublasLt64_12.dll all visible by the time the DLL link test runs.
      - name: Install CUDA Toolkit (CUDA Windows)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'cuda-windows'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.0'
          method: network
          sub-packages: '["cudart", "cublas"]'

      - name: Verify CUDA runtime DLLs (CUDA Windows)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'cuda-windows'
        shell: bash
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          ls -la "$CUDA_PATH/bin" || true
          # Re-export bin dir to $GITHUB_PATH for subsequent steps; idempotent
          # if Jimver already added it.
          echo "$CUDA_PATH\\bin" >> "$GITHUB_PATH"
          # Sanity check the three DLLs the wheel needs.
          for dll in cudart64_12.dll cublas64_12.dll cublasLt64_12.dll; do
            if [ ! -f "$CUDA_PATH/bin/$dll" ]; then
              echo "::error::Missing $dll under $CUDA_PATH/bin"; exit 1
            fi
          done

      # Vulkan Windows: ggml-vulkan.dll links against the Vulkan loader
      # (vulkan-1.dll), normally shipped with the GPU driver. windows-latest
      # has no driver, so download the loader DLL straight from LunarG. The
      # `vulkan-runtime` chocolatey package was removed from the community
      # repo, so we no longer rely on it.
      - name: Install Vulkan loader (Vulkan Windows)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'vulkan-windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.290.0
          cache: true

      - name: Verify Vulkan loader (Vulkan Windows)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'vulkan-windows'
        shell: bash
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          # The SDK ships vulkan-1.dll under Bin/. Add Bin to PATH and
          # GITHUB_PATH so subsequent steps (and ctypes via add_dll_directory)
          # can resolve it.
          ls -la "$VULKAN_SDK/Bin/vulkan-1.dll"
          echo "$VULKAN_SDK\\Bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK_BIN=$VULKAN_SDK\\Bin" >> "$GITHUB_ENV"

      # Vulkan macOS Intel: the dylib's NEEDED is `@rpath/libvulkan.1.dylib`.
      # macos-15-intel ships neither the loader nor MoltenVK; install via
      # Homebrew (Intel prefix is /usr/local, which the dyld error already
      # showed as one of the searched rpath fallbacks).
      - name: Install Vulkan loader (Vulkan macOS Intel)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'vulkan-macos-intel'
        shell: bash
        run: |
          brew update
          brew install vulkan-loader molten-vk
          ls -la /usr/local/lib/libvulkan*.dylib || true

      # ROCm Linux: install hip + rocBLAS / hipBLAS runtimes from AMD's apt
      # repo. We deliberately avoid the full `rocm-libs` meta-package — it
      # pulls in several GB of dev headers we don't need for an import test.
      - name: Install ROCm runtime libs (ROCm Linux)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'rocm'
        shell: bash
        run: |
          sudo mkdir -p --mode=0755 /etc/apt/keyrings
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.2 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            hip-runtime-amd \
            hipblas \
            rocblas \
            hipblaslt \
            rocsolver \
            comgr \
            rocprofiler-register
          # The wheel's NEEDED entries reference unversioned soname suffixes
          # (libamdhip64.so.6 etc.); ROCm packages install those symlinks under
          # /opt/rocm/lib. Expose that on LD_LIBRARY_PATH for subsequent steps.
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # SYCL Linux: oneAPI runtime install was previously after the import
      # step, which dies first with `ImportError: libsycl.so.8`. Run it here
      # and locate libsycl/libOpenCL so we can prepend their dirs to
      # LD_LIBRARY_PATH.
      - name: Install Intel oneAPI runtime (SYCL Linux)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'sycl'
        shell: bash
        run: |
          wget -qO - https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          # Pin to the same oneAPI release used by the build job
          # (intel-oneapi-dpcpp-cpp-2025.3 — see _gpu-build-sycl.yml). Newer
          # runtimes ship a different libsycl soname (libsycl.so.9+), but the
          # wheel is linked against libsycl.so.8 from the 2025.3 release.
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-runtime-opencl-2025.3 \
            intel-oneapi-runtime-dpcpp-cpp-2025.3 \
            intel-oneapi-runtime-mkl-2025.3 \
            intel-oneapi-runtime-tbb-2022.3 \
            ocl-icd-libopencl1
          # oneAPI runtimes land under /opt/intel/oneapi/redist/lib (and
          # arch-specific subdirs). Find the dir holding libsycl.so.8 and put
          # it on LD_LIBRARY_PATH for subsequent steps.
          SYCL_LIB=$(find /opt/intel -name 'libsycl.so.8' | head -1)
          if [ -z "$SYCL_LIB" ]; then
            echo "::error::libsycl.so.8 not found after oneAPI install"
            find /opt/intel -name 'libsycl.so*' || true
            exit 1
          fi
          SYCL_LIB_DIR=$(dirname "$SYCL_LIB")
          echo "Found libsycl.so.8 in: $SYCL_LIB_DIR"
          echo "LD_LIBRARY_PATH=$SYCL_LIB_DIR:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # Windows-only: link-test every bundled ggml-*.dll. Catches the bug
      # class where delvewheel-bundled siblings are unreachable because
      # the libs dir is not on PATH.
      - name: Smoke test - DLL link (Windows)
        if: steps.check.outputs.skip != 'true' && runner.os == 'Windows'
        shell: bash
        env:
          CUDA_BIN: ${{ env.CUDA_PATH && format('{0}\bin', env.CUDA_PATH) || '' }}
        run: |
          source smoke-venv/Scripts/activate
          python -c "
          import ctypes, glob, os, site, sys
          # Python 3.8+ on Windows ignores PATH for DLL deps of ctypes-loaded
          # libs; explicitly register the CUDA bin dir (and any inferna*.libs
          # dirs) so ggml-cuda.dll can resolve cudart64_12.dll/cublas64_12.dll.
          extra_dirs = []
          cuda_bin = os.environ.get('CUDA_BIN') or (
              os.path.join(os.environ['CUDA_PATH'], 'bin')
              if os.environ.get('CUDA_PATH') else None
          )
          if cuda_bin and os.path.isdir(cuda_bin):
              extra_dirs.append(cuda_bin)
          vulkan_bin = os.environ.get('VULKAN_SDK_BIN') or (
              os.path.join(os.environ['VULKAN_SDK'], 'Bin')
              if os.environ.get('VULKAN_SDK') else None
          )
          if vulkan_bin and os.path.isdir(vulkan_bin):
              extra_dirs.append(vulkan_bin)
          failed = []
          for sp in site.getsitepackages():
              for libs in glob.glob(os.path.join(sp, 'inferna*.libs')):
                  extra_dirs.append(libs)
          for d in extra_dirs:
              try:
                  os.add_dll_directory(d)
                  print(f'add_dll_directory: {d}')
              except OSError as e:
                  print(f'WARN add_dll_directory failed for {d}: {e}')
          for sp in site.getsitepackages():
              for libs in glob.glob(os.path.join(sp, 'inferna*.libs')):
                  for dll in sorted(glob.glob(os.path.join(libs, 'ggml-*.dll'))):
                      try:
                          ctypes.WinDLL(dll)
                      except OSError as e:
                          failed.append((dll, str(e)))
                      else:
                          print(f'OK   {dll}')
          if failed:
              for d, e in failed:
                  print(f'FAIL {d}: {e}', file=sys.stderr)
              sys.exit(1)
          "

      # Source checkout — the centralized smoke script lives in
      # scripts/ci_smoke.py and the test model fixture path resolution
      # below uses the checkout for clarity.
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'
        with:
          path: src-checkout

      - name: Smoke test - imports
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          python src-checkout/scripts/ci_smoke.py --label "${{ matrix.backend }}"

      - name: Smoke test - inferna info
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          python -m inferna info

      - name: Cache test model
        if: steps.check.outputs.skip != 'true'
        id: cache-model
        uses: actions/cache@v5
        with:
          path: models/Llama-3.2-1B-Instruct-Q8_0.gguf
          key: test-model-llama-3.2-1b-q8

      - name: Download test model
        if: steps.check.outputs.skip != 'true' && steps.cache-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -sL https://huggingface.co/unsloth/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q8_0.gguf \
            -o models/Llama-3.2-1B-Instruct-Q8_0.gguf

      - name: Smoke test - SYCL 1-token CPU inference
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'sycl'
        continue-on-error: true
        env:
          ONEAPI_DEVICE_SELECTOR: opencl:cpu
        run: |
          source smoke-venv/bin/activate
          python -c "
          from inferna import complete
          response = complete(
              'Hi',
              model_path='models/Llama-3.2-1B-Instruct-Q8_0.gguf',
              n_ctx=128,
              max_tokens=1,
          )
          print(f'SYCL CPU decode response: {response!r}')
          assert len(str(response).strip()) > 0, 'Empty response'
          print('SYCL CPU inference smoke test passed')
          "

      - name: Smoke test - CPU-fallback 1-token inference
        if: steps.check.outputs.skip != 'true' && matrix.backend != 'sycl'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          python -c "
          from inferna import complete
          response = complete(
              'Hi',
              model_path='models/Llama-3.2-1B-Instruct-Q8_0.gguf',
              n_ctx=128,
              max_tokens=1,
              n_gpu_layers=0,
          )
          print(f'CPU-fallback decode response: {response!r}')
          assert len(str(response).strip()) > 0, 'Empty response'
          print('CPU-fallback inference smoke test passed')
          "
