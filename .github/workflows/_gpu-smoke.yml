name: _gpu-smoke

# Reusable smoke-test job for GPU wheels. Called by build-gpu-wheels.yml
# (stable) and build-gpu-wheels-abi3.yml (abi3) after the per-backend
# build jobs complete. Each entry of the matrix is gated on whether the
# corresponding backend was actually requested by the caller.
#
# Scope: this is intentionally a *packaging* smoke test, not a runtime
# test. Stock GitHub runners have no GPU drivers, so `import inferna`
# would require us to install per-backend runtime DSOs (libcuda,
# libsycl, vulkan-1.dll, ...) before the wheel could load. That path
# was brittle (vendor repos / package names drift across releases), so
# we now only verify:
#   - the wheel installs cleanly into a fresh venv
#   - core metadata is visible (`pip show`)
#   - the wheel contents look right (expected top-level package, no
#     stray files)
# Actual GPU-backed inference is exercised by users on real hardware.

on:
  workflow_call:
    inputs:
      wheel_kind:
        description: '"stable" | "abi3" — controls which artifact name to download'
        type: string
        required: true
      cuda_linux:
        type: boolean
        required: true
      rocm_linux:
        type: boolean
        required: true
      sycl_linux:
        type: boolean
        required: true
      vulkan_linux:
        type: boolean
        required: true
      cuda_windows:
        type: boolean
        required: true
      vulkan_windows:
        type: boolean
        required: true
      vulkan_macos_intel:
        type: boolean
        required: true

jobs:
  smoke:
    name: Smoke test - ${{ matrix.backend }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            runs-on: ubuntu-latest
            slug: cuda-linux-x86_64
            condition: cuda_linux
          - backend: rocm
            runs-on: ubuntu-latest
            slug: rocm-linux-x86_64
            condition: rocm_linux
          - backend: sycl
            runs-on: ubuntu-latest
            slug: sycl-linux-x86_64
            condition: sycl_linux
          - backend: vulkan
            runs-on: ubuntu-latest
            slug: vulkan-linux-x86_64
            condition: vulkan_linux
          - backend: cuda-windows
            runs-on: windows-latest
            slug: cuda-windows-x86_64
            condition: cuda_windows
          - backend: vulkan-windows
            runs-on: windows-latest
            slug: vulkan-windows-x86_64
            condition: vulkan_windows
          - backend: vulkan-macos-intel
            runs-on: macos-15-intel
            slug: vulkan-macos-intel-x86_64
            condition: vulkan_macos_intel

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          case "${{ inputs.wheel_kind }}" in
            stable|abi3) ;;
            *) echo "::error::wheel_kind must be 'stable' or 'abi3', got '${{ inputs.wheel_kind }}'"; exit 1 ;;
          esac

      - name: Check if backend was built
        id: check
        shell: bash
        env:
          CUDA_LINUX: ${{ inputs.cuda_linux }}
          ROCM_LINUX: ${{ inputs.rocm_linux }}
          SYCL_LINUX: ${{ inputs.sycl_linux }}
          VULKAN_LINUX: ${{ inputs.vulkan_linux }}
          CUDA_WINDOWS: ${{ inputs.cuda_windows }}
          VULKAN_WINDOWS: ${{ inputs.vulkan_windows }}
          VULKAN_MACOS_INTEL: ${{ inputs.vulkan_macos_intel }}
        run: |
          case "${{ matrix.condition }}" in
            cuda_linux)         val="$CUDA_LINUX" ;;
            rocm_linux)         val="$ROCM_LINUX" ;;
            sycl_linux)         val="$SYCL_LINUX" ;;
            vulkan_linux)       val="$VULKAN_LINUX" ;;
            cuda_windows)       val="$CUDA_WINDOWS" ;;
            vulkan_windows)     val="$VULKAN_WINDOWS" ;;
            vulkan_macos_intel) val="$VULKAN_MACOS_INTEL" ;;
            *)                  val="false" ;;
          esac
          if [ "$val" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Compute artifact name
        if: steps.check.outputs.skip != 'true'
        id: artifact
        shell: bash
        run: |
          PREFIX=""
          if [ "${{ inputs.wheel_kind }}" = "abi3" ]; then PREFIX="abi3-"; fi
          echo "name=wheels-${PREFIX}${{ matrix.slug }}" >> "$GITHUB_OUTPUT"

      - name: Download wheel artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: wheels

      - name: Find matching wheel
        if: steps.check.outputs.skip != 'true'
        id: find-wheel
        shell: bash
        run: |
          WHEEL=$(find wheels -name "*cp312*" | head -1)
          if [ -z "$WHEEL" ]; then
            WHEEL=$(find wheels -name "*.whl" | head -1)
          fi
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel found under wheels/"; exit 1
          fi
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "Found wheel: $WHEEL"

      - name: Install wheel in clean venv
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          python -m venv smoke-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          pip install "${{ steps.find-wheel.outputs.wheel }}"

      - name: Inspect installed package metadata
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          # `pip show` resolves whichever inferna* distribution the wheel
          # advertises (inferna, inferna-cuda12, inferna-sycl, ...).
          pip list | grep -i '^inferna' || { echo "::error::no inferna* dist installed"; exit 1; }
          DIST=$(pip list --format=freeze | awk -F'==' '/^inferna/{print $1; exit}')
          echo "Distribution: $DIST"
          pip show "$DIST"

      - name: Inspect wheel contents
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          python - <<'PY'
          import sys, zipfile, os, glob
          wheel = os.environ["WHEEL"]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
          print(f"Wheel: {wheel}")
          print(f"Entries: {len(names)}")
          # Sanity: the wheel must contain the inferna package and at least
          # one native module.
          has_pkg = any(n.startswith("inferna/") for n in names)
          has_native = any(
              n.startswith("inferna/") and (n.endswith(".so") or n.endswith(".pyd") or n.endswith(".dylib"))
              for n in names
          )
          if not has_pkg:
              print("::error::wheel missing inferna/ package", file=sys.stderr)
              sys.exit(1)
          if not has_native:
              print("::error::wheel missing native extension (.so/.pyd/.dylib)", file=sys.stderr)
              sys.exit(1)
          print("OK: inferna/ package and native extension present")
          PY
        env:
          WHEEL: ${{ steps.find-wheel.outputs.wheel }}
