name: build-gpu-wheels-abi3

# Release build for the GPU wheels (abi3, cp312-*; see docs/dev/abi3.md).
# Dispatches to the per-backend reusable workflows `_gpu-build-*.yml`:
#   - cibw_build narrowed to "cp312-*"
#   - cibw_version pinned to "3.4.1"
#   - wheel_kind set to "abi3" (controls artifact + cache key prefix)
#   - extra_cibw_env injects SKBUILD_CMAKE_DEFINE / SKBUILD_WHEEL_PY_API
#
# Triggers:
#   push of a bare-semver tag (0.3.2) -> build every backend, then publish
#                                        the GitHub release for that tag
#   workflow_dispatch against a tag   -> same, with per-backend opt-out;
#                                        republishes an existing release
#   workflow_dispatch against a branch -> build only
#
# A tag push builds all six backends, Windows included: those wheels are
# not on PyPI, so the GitHub release is where they ship. The dispatch
# defaults stay as they were, for cheap one-off builds.
#
# The CPU/Metal wheels attach to the same release from
# build-cibw-abi3.yml. Both use softprops/action-gh-release, which creates
# the release once and updates it thereafter, so either order works and
# either can be re-run alone.

permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      link_mode:
        description: 'Linking mode'
        required: true
        default: 'dynamic'
        type: choice
        options:
          - dynamic
          - static
      cuda_linux:
        description: 'Build CUDA wheels'
        required: false
        default: true
        type: boolean
      rocm_linux:
        description: 'Build ROCm wheels'
        required: false
        default: true
        type: boolean
      sycl_linux:
        description: 'Build SYCL wheels'
        required: false
        default: true
        type: boolean
      vulkan_linux:
        description: 'Build Vulkan wheels (Linux x86_64)'
        required: false
        default: true
        type: boolean
      vulkan_windows:
        description: 'Build Vulkan wheels (Windows x86_64) -- not published to PyPI'
        required: false
        default: false
        type: boolean
      cuda_windows:
        description: 'Build CUDA wheels (Windows x86_64) -- not published to PyPI'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.link_mode || 'dynamic' }}
  cancel-in-progress: true

jobs:
  cuda:
    uses: ./.github/workflows/_gpu-build-cuda.yml
    with:
      wheel_kind: abi3
      cibw_version: "3.4.1"
      cibw_build: "cp312-*"
      link_mode: ${{ inputs.link_mode || 'dynamic' }}
      enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.cuda_linux }}
      extra_cibw_env: 'SKBUILD_CMAKE_DEFINE="INFERNA_ABI3=ON" SKBUILD_WHEEL_PY_API=cp312'

  rocm:
    uses: ./.github/workflows/_gpu-build-rocm.yml
    with:
      wheel_kind: abi3
      cibw_version: "3.4.1"
      cibw_build: "cp312-*"
      link_mode: ${{ inputs.link_mode || 'dynamic' }}
      enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.rocm_linux }}
      extra_cibw_env: 'SKBUILD_CMAKE_DEFINE="INFERNA_ABI3=ON" SKBUILD_WHEEL_PY_API=cp312'

  sycl:
    uses: ./.github/workflows/_gpu-build-sycl.yml
    with:
      wheel_kind: abi3
      cibw_version: "3.4.1"
      cibw_build: "cp312-*"
      link_mode: ${{ inputs.link_mode || 'dynamic' }}
      enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.sycl_linux }}
      extra_cibw_env: 'SKBUILD_CMAKE_DEFINE="INFERNA_ABI3=ON" SKBUILD_WHEEL_PY_API=cp312'

  vulkan_linux:
    uses: ./.github/workflows/_gpu-build-vulkan-linux.yml
    with:
      wheel_kind: abi3
      cibw_version: "3.4.1"
      cibw_build: "cp312-*"
      link_mode: ${{ inputs.link_mode || 'dynamic' }}
      enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.vulkan_linux }}
      extra_cibw_env: 'SKBUILD_CMAKE_DEFINE="INFERNA_ABI3=ON" SKBUILD_WHEEL_PY_API=cp312'

  vulkan_windows:
    uses: ./.github/workflows/_gpu-build-vulkan-windows.yml
    with:
      wheel_kind: abi3
      cibw_version: "3.4.1"
      cibw_build: "cp312-*"
      link_mode: ${{ inputs.link_mode || 'dynamic' }}
      enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.vulkan_windows }}
      extra_cibw_env: 'SKBUILD_CMAKE_DEFINE="INFERNA_ABI3=ON" SKBUILD_WHEEL_PY_API=cp312'

  cuda_windows:
    uses: ./.github/workflows/_gpu-build-cuda-windows.yml
    with:
      wheel_kind: abi3
      cibw_version: "3.4.1"
      cibw_build: "cp312-*"
      link_mode: ${{ inputs.link_mode || 'dynamic' }}
      enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.cuda_windows }}
      extra_cibw_env: 'SKBUILD_CMAKE_DEFINE="INFERNA_ABI3=ON" SKBUILD_WHEEL_PY_API=cp312'

  # smoke:
  #   needs: [cuda, rocm, sycl, vulkan_linux, vulkan_windows, cuda_windows]
  #   if: always() && !cancelled()
  #   uses: ./.github/workflows/_gpu-smoke.yml
  #   with:
  #     wheel_kind: abi3
  #     cuda_linux: ${{ inputs.cuda_linux }}
  #     rocm_linux: ${{ inputs.rocm_linux }}
  #     sycl_linux: ${{ inputs.sycl_linux }}
  #     vulkan_linux: ${{ inputs.vulkan_linux }}
  #     cuda_windows: ${{ inputs.cuda_windows }}
  #     vulkan_windows: ${{ inputs.vulkan_windows }}

  collect:
    needs: [cuda, rocm, sycl, vulkan_linux, vulkan_windows, cuda_windows]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wheels-abi3-*

      - name: Collect into single directory
        run: |
          mkdir -p dist
          find artifacts -name "*.whl" -exec cp {} dist/ \;
          echo "=== Collected abi3 wheels ==="
          ls -lh dist/ || true

      - uses: actions/upload-artifact@v7
        with:
          name: inferna-gpu-abi3-wheels-all
          path: dist/*.whl
          if-no-files-found: ignore

  publish:
    name: Publish to GitHub Release
    # Deliberately not gated on every backend leg succeeding: the
    # release is a prerelease, so attaching the backends that did build
    # and re-running the ones that failed is the normal path.
    needs: [collect]
    if: always() && !cancelled() && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: inferna-gpu-abi3-wheels-all
          path: dist

      - name: List wheels
        run: ls -lh dist/

      - name: Warn if the tag disagrees with pyproject
        # Not a gate -- the tag names the release, pyproject only names
        # the wheel files. Worth an annotation when they diverge.
        run: |
          version=$(python3 -c "
          import re
          text = open('pyproject.toml').read()
          print(re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.M).group(1))
          ")
          [ "$TAG" = "$version" ] || echo "::warning::tag $TAG does not match pyproject version $version"

      - name: Extract release notes from CHANGELOG
        id: notes
        # release_notes.py exits 2 and writes nothing when neither
        # `## [<tag>]` nor `## [Unreleased]` is present. A release without
        # notes beats a failed release, so fall back to GitHub's generated
        # ones.
        run: |
          if python3 scripts/release_notes.py "$TAG" --output release-notes.md; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            cat release-notes.md
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no CHANGELOG section for $TAG; using generated notes"
          fi

      # Creates the release on first run and updates it on re-run, so the
      # CPU and GPU workflows can both publish to the same tag and either
      # can be re-run. Always a prerelease: promoting to a final release
      # is a deliberate manual step (`gh release edit <tag>
      # --prerelease=false`).
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: inferna ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.found == '1' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != '1' }}
          prerelease: true

      - name: Upload wheels
        # --clobber so re-running one build leg tops up the release
        # instead of failing on the assets already there. Uploads are
        # deliberately additive: a release carrying only some backends is
        # a valid intermediate state while the rest are re-run.
        run: gh release upload "$TAG" dist/*.whl --clobber
